version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: cinema_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_production_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cinema_platform}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_user -d cinema_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinema_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cinema_redis_secure_pass}
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cinema_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinema_prod_backend
    restart: always
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://cinema_user:${POSTGRES_PASSWORD:-cinema_production_secure_pass}@postgres:5432/cinema_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinema_redis_secure_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cinema_jwt_super_secret_production_key_32bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cinema_prod_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  prod_postgres_data:
  prod_redis_data:
