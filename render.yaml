services:
  - type: web
    name: cinema-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinema-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cinema-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173"

  - type: redis
    name: cinema-redis
    plan: free
    ipAllowList: []

databases:
  - name: cinema-db
    databaseName: cinema_platform
    user: cinema_user
    plan: free
